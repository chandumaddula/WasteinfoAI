# WasteinfoAI - Classifier Configuration (Phases 3–4)
# Model architecture, training hyperparameters, preprocessing, and export settings

project:
  name: "wasteinfoAI-classifier"
  version: "1.0.0"
  description: "MobileNetV3-Small on-device waste classification baseline"

model:
  architecture: "rexnet_150"
  pretrained: true
  num_classes: 17
  dropout: 0.2
  input_shape: [1, 3, 224, 224]

dataset:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  labels_file: "labels/class_names.json"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  random_seed: 42
  image_size: 224
  crop_padding: 32
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

training:
  batch_size: 32
  num_workers: 2
  epochs: 20
  learning_rate: 0.0005
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  min_lr: 0.00001
  device: "auto"  # 'auto', 'cuda', or 'cpu'
  checkpoint_dir: "checkpoints"
  save_best_only: true
  early_stopping_patience: 5
  freeze_backbone_epochs: 3

evaluation:
  confidence_threshold: 0.60
  reports_dir: "reports"
  summary_file: "reports/evaluation_summary.json"

export:
  exported_dir: "exported"
  output_model_name: "waste_classifier.pte"
  android_asset_path: "../android/app/src/main/assets/vision/waste_classifier.pte"
  target_backend: "xnnpack"
