# wasteinfoAI - classifier configuration (single source of truth)
project:
  name: "wasteinfoAI-classifier"
  version: "2.0.0"

model:
  # any timm model. Options: mobilenetv3_large_100 (fast), efficientnet_b0 (balanced), rexnet_150 (most accurate)
  architecture: "mobilenetv3_large_100"
  pretrained: true
  dropout: 0.2
  input_shape: [1, 3, 224, 224]

dataset:
  image_dir: "data/balanced_waste_images"   # one sub-folder per class (case-insensitive match)
  splits_dir: "data/splits"                 # split_manifest.json is written here once and reused everywhere
  labels_file: "labels/class_names.json"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  random_seed: 42
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

training:
  batch_size: 32
  num_workers: 2            # forced to 0 on Windows
  epochs: 25
  learning_rate: 0.001      # head LR; backbone uses learning_rate * backbone_lr_mult
  backbone_lr_mult: 0.2
  weight_decay: 0.0001
  min_lr: 0.00001
  label_smoothing: 0.1
  device: "auto"
  checkpoint_dir: "checkpoints"
  early_stopping_patience: 6
  freeze_backbone_epochs: 2

evaluation:
  tta: true                           # horizontal-flip test-time augmentation
  summary_file: "reports/evaluation_summary.json"
  policy_file: "reports/rejection_policy.json"
  ood_dir: "data/ood"                 # OPTIONAL: real non-waste photos (hands, rooms, people, pets)
  target_accuracy_on_accepted: 0.97
  max_false_accept_rate: 0.10

export:
  exported_dir: "exported"
  output_model_name: "waste_classifier.pte"
  android_asset_path: "../android/app/src/main/assets/vision/waste_classifier.pte"
